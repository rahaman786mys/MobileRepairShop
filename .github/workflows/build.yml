name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          VERSION_NAME="1.5.14"
          VERSION_CODE=$(date +%s)
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Update version.json on Master
        run: |
          APK_NAME=$(ls app/build/outputs/apk/debug/*.apk | head -n 1 | xargs basename)
          echo "{
            \"versionCode\": $(grep "versionCode" app/build.gradle | awk '{print $2}'),
            \"versionName\": \"$(grep "versionName" app/build.gradle | cut -d'\"' -f2)\",
            \"downloadUrl\": \"https://github.com/${{ github.repository }}/raw/master/builds/app-debug.apk\",
            \"releaseNotes\": \"Immediate deployment: Automatic build from master branch. Includes latest features and fixes.\"
          }" > version.json
          
          mkdir -p builds
          cp app/build/outputs/apk/debug/*.apk builds/app-debug.apk
          
          git config --global user.email "bot@muzzutech.com"
          git config --global user.name "MuZZu Build Bot"
          git add version.json builds/app-debug.apk
          git commit -m "Auto-deploy: Update APK and version.json [skip ci]"
          git push origin master
