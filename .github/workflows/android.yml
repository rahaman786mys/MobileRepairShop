name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      shell: bash

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Inject Debug Keystore
      run: |
        echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > app/debug.keystore
        ls -la app/debug.keystore
        keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -v | grep SHA1

    - name: Build Release APK
      run: ./gradlew clean assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
      shell: bash

    - name: Verify APK
      run: ls -la app/build/outputs/apk/release/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-MuZZu-release
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.5.6-build-${{ github.run_number }}
        name: "MuZZu Tech Professional v1.5.6 (Build ${{ github.run_number }})"
        body: "Hardened Enterprise Release. Full accounting (Tally-style), verified photo persistence, and universal Android compatibility (7.0 to 14)."
        files: app/build/outputs/apk/release/*.apk
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
