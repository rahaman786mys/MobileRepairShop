name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update versionCode in build.gradle
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Convert 1.5.11 -> 1005011
          IFS='.' read -r major minor patch <<< "$TAG_VERSION"
          VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))
          echo "Tag version: $TAG_VERSION -> versionCode: $VERSION_CODE"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$TAG_VERSION\"/" app/build.gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with version
        run: |
          TAG="${{ steps.get_version.outputs.VERSION }}"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/app-debug-v${TAG}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.get_version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## MuZZu Tech v${{ steps.get_version.outputs.VERSION }}

            ### Changes
            See commit history for details.

            ### Download
            - [APK Download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug-v${{ steps.get_version.outputs.VERSION }}.apk)
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true