plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
}

def localProps = rootProject.file('local.properties')
def props = new Properties()
if (localProps.exists()) {
    props.load(localProps.newDataInputStream())
}
def releaseStoreFile = props.getProperty('STORE_FILE')
def releaseStorePassword = props.getProperty('STORE_PASSWORD')
def releaseKeyAlias = props.getProperty('KEY_ALIAS')
def releaseKeyPassword = props.getProperty('KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.app.muzzutech'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.muzzutech"
        minSdk 24
        targetSdk 34
        versionCode 1005007
        versionName "1.5.7"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // OTP credentials injected from local.properties (enforced for release builds only)
        def enforceOtpSecrets = project.hasProperty('enforceOtpSecrets') ? project.enforceOtpSecrets.toBoolean() : false

        if (enforceOtpSecrets || gradle.startParameter.taskNames.any { it.contains('Release') }) {
            def otpApiKey = props.getProperty('otp.api.key')
            if (otpApiKey == null || otpApiKey.isEmpty()) {
                throw new GradleException("otp.api.key not found in local.properties")
            }
            def otpSenderId = props.getProperty('otp.sender.id')
            if (otpSenderId == null || otpSenderId.isEmpty()) {
                throw new GradleException("otp.sender.id not found in local.properties")
            }
            def otpTemplateId = props.getProperty('otp.template.id')
            if (otpTemplateId == null || otpTemplateId.isEmpty()) {
                throw new GradleException("otp.template.id not found in local.properties")
            }
            buildConfigField "String", "OTP_API_KEY", "\"$otpApiKey\""
            buildConfigField "String", "OTP_SENDER_ID", "\"$otpSenderId\""
            buildConfigField "String", "OTP_TEMPLATE_ID", "\"$otpTemplateId\""
        } else {
            buildConfigField "String", "OTP_API_KEY", "\"\""
            buildConfigField "String", "OTP_SENDER_ID", "\"\""
            buildConfigField "String", "OTP_TEMPLATE_ID", "\"\""
        }

        // Update check URL (configurable via local.properties)
        def updateCheckUrl = props.getProperty('update.check.url',
            'https://raw.githubusercontent.com/rahaman786mys/MobileRepairShop/master/version.json')
        buildConfigField "String", "UPDATE_CHECK_URL", "\"$updateCheckUrl\""
    }

    signingConfigs {
        debug {
            def keystoreFile = rootProject.file('app/debug.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "2g"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Preserve ProGuard mapping file for crash deobfuscation
    android.applicationVariants.all { variant ->
        variant.assembleProvider.configure {
            doLast {
                def mappingDir = project.file("${rootDir}/build/outputs/mapping/${variant.name}")
                if (variant.mappingFile != null && variant.mappingFile.exists()) {
                    copy {
                        from variant.mappingFile
                        into mappingDir
                        rename { String fileName -> "mapping-${variant.versionName}.txt" }
                    }
                }
            }
        }
    }
}

tasks.withType(Test) {
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat = "full"
        showStackTraces = true
        showCauses = true
        showExceptions = true
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    ksp 'com.github.bumptech.glide:compiler:4.16.0'

    // ML Kit
    implementation 'com.google.mlkit:object-detection:17.0.2'
    implementation 'com.google.mlkit:image-labeling:17.0.9'

    // JSON & Networking
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.1.0'

    // MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ML Kit Task -> Coroutines bridge
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Jetpack Compose (for new screens only)
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // WorkManager (background jobs)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Encrypted storage (SQLCipher + EncryptedSharedPreferences)
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite-ktx:2.4.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Play In-App Updates (for Play Store distribution)
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core-ktx:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.5.1'
    testImplementation 'androidx.room:room-testing:2.6.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core-ktx:1.5.0'
    testImplementation 'androidx.work:work-testing:2.9.0'
    androidTestImplementation 'androidx.work:work-testing:2.9.0'
}
