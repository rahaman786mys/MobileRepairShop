name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          TIMESTAMP=$(date +%s)
          VERSION_NAME="1.5.14-b$TIMESTAMP"
          sed -i "s/versionCode [0-9]*/versionCode $TIMESTAMP/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Update version.json on Master
        run: |
          # Use force add to bypass .gitignore for the builds folder
          mkdir -p builds
          cp app/build/outputs/apk/debug/*.apk builds/app-debug.apk
          
          # Safely extract values without complex pipes that fail in shell
          V_CODE=$(grep "versionCode" app/build.gradle | awk '{print $2}')
          V_NAME=$(grep "versionName" app/build.gradle | awk -F'"' '{print $2}')
          
          echo "{
            \"versionCode\": $V_CODE,
            \"versionName\": \"$V_NAME\",
            \"downloadUrl\": \"https://github.com/${{ github.repository }}/raw/master/builds/app-debug.apk\",
            \"releaseNotes\": \"Strong Update: Automatic build from master branch. Includes latest features and fixes.\"
          }" > version.json
          
          git config --global user.email "bot@muzzutech.com"
          git config --global user.name "MuZZu Build Bot"
          git add version.json
          git add -f builds/app-debug.apk
          git commit -m "Auto-deploy: v$V_NAME (build $V_CODE) [skip ci]"
          git push origin master
